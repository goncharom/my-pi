name: Build VSIX

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build-vsix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Package VSIX
        run: pnpm --filter pi-vscode-review package

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: pi-vscode-review-vsix
          path: packages/extensions/pi-vscode/packages/vscode-extension/*.vsix
